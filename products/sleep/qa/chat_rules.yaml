# 对话回答的合规规则（只管大模型生成的回答；审核过的问答原文不受影响）。
# 和营销文案的词表分开：对话里需要说「不能替代医生的诊断和治疗」这类边界说明，所以不禁「治疗」「诊断」本身，
# 只禁功效承诺和容易误导的说法。命中任意一条，这次生成作废，改用审核过的问答或如实说答不了。
block:
  - 治愈
  - 根治
  - 疗效
  - 疗程
  - 包治
  - 药到病除
  - 无副作用
  - 零风险
  - 保证见效
  - 保证有效
  - 一定有效
  - 一定能睡
  - 立竿见影
  - 永不复发
  - 治疗失眠
  - 治好
  - 告别安眠药
  - 替代安眠药
  - 不用吃药
  - 可以停药
  - 建议停药
  - 好转反应
  - 排毒
  - 祖传
  - 秘方
# 正则：百分比数字（没有依据的有效率）、具体药名剂量之类
block_patterns:
  - '\d+(\.\d+)?\s*[%％]'
  - '百分之[一二三四五六七八九十百]+'
