# 对话回答的合规规则（只管大模型生成的回答；审核过的问答原文不受影响）。
# 和营销文案的词表分开：对话里需要说「不能替代医生的诊断和治疗」这类边界说明，所以不禁「治疗」「诊断」本身，
# 只禁功效承诺和容易误导的说法。命中任意一条，这次生成作废，改用审核过的问答或如实说答不了。
block:
  - 治愈
  - 根治
  - 疗效
  - 疗程
  - 包治
  - 药到病除
  - 无副作用
  - 零风险
  - 保证见效
  - 保证有效
  - 一定有效
  - 一定能睡
  - 立竿见影
  - 永不复发
  - 治疗失眠
  - 治好
  - 告别安眠药
  - 替代安眠药
  - 不用吃药
  - 可以停药
  - 建议停药
  - 好转反应
  - 排毒
  - 祖传
  - 秘方
# 正则：百分比数字（没有依据的有效率）、具体药名剂量之类
block_patterns:
  - '\d+(\.\d+)?\s*[%％]'
  - '百分之[一二三四五六七八九十百]+'

# 倾听陪伴时额外不能出现的说法：给对方下诊断、替对方做决定、假装有人类经历
companion_block_patterns:
  - '你(这|这个|这种情况)?(是|有|得了|属于|可能是|应该是|就是)[^，。！？]{0,8}(抑郁|焦虑症|双相|障碍|强迫症|神经衰弱|心理疾病|精神)'
  - '(建议|应该|最好|不如)[^，。！？]{0,6}(离婚|分手|辞职|断绝)'
  - '我也(经历|有过|曾经|是这样)'
  - '(一直|永远)(陪着你|在你身边)'
  - '(原生家庭|童年阴影|童年创伤)'

# 需要留意的说法：不一定是危机，但会提醒大模型多关切一句，并记到后台「需要留意」里
watch:
  - 撑不下去
  - 撑不住
  - 活着好累
  - 活着真累
  - 没有意义
  - 没意思透了
  - 想消失
  - 消失就好了
  - 崩溃
  - 绝望
  - 没人在乎
  - 没有人在乎
  - 我是个累赘
  - 拖累
  - 不想醒来
  - 睡着了别醒
  - 好想逃
  - 受不了了
