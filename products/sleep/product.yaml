id: sleep
name: 助眠养生
# 服务项目来自门店美团页面，服务方式的描述待合作方用自己的话确认后替换
description: >-
  「沁自然助眠中心」，线下身心放松空间。主要项目有颅骶放松、呼吸训练、感知训练课程、正念读书角，
  环境安静，配合音乐、香氛和精油。
  颅骶放松不是按摩：以非常轻柔的手部接触为主，不按压、不揉捏、不讲力度，重在让人安静下来、慢慢放松，
  很多顾客在过程中会睡着。门店还会教顾客在家可以做的呼吸和放松方法。
  内容用于门店引流、招募加盟商和加盟商培训。属于养生保健服务，不是医疗服务，门店也明确对顾客这样说明。
brand_voice: >-
  温和、专业、有生活气息；像懂行的朋友在分享，不夸大，不制造焦虑，不推销。
  描写服务时不要写成按摩：不出现按揉、揉开、推拿、按压、力度这类说法。
  项目名称用「颅骶放松」，不用「颅骶疗法」。

audiences:
  - id: c_local
    name: 门店周边有睡眠困扰的人（C端）
    description: 工作压力大、作息不规律、想找个地方放松一下的普通人
  - id: b_franchise
    name: 加盟意向者（B端）
    description: 美容院、养生馆、按摩店店主，以及想在养生行业创业的人
  - id: trainee
    name: 已签约加盟商和技师
    description: 需要掌握服务流程、话术和门店运营方法的人

content_types:
  - id: seeding
    name: 种草笔记
  - id: group_buy
    name: 团购详情
  - id: store_event
    name: 门店活动文案
  - id: poster
    name: 海报/传单文案
  - id: franchise
    name: 招商文案
  - id: training
    name: 培训话术

channels: [xiaohongshu, dianping, douyin_script, offline_print, wechat_moments]

# 营销文案只参考低、中风险的知识卡片；高风险卡片（疾病、药物、孕婴等）只用于查询
generation_max_risk: mid

compliance:
  extra_block:
    - 治疗失眠
    - 根治失眠
    - 治愈失眠
    - 告别安眠药
    - 替代安眠药
    - 不用吃药
    - 停药
    # 颅骶放松不是按摩，描写成按摩是错误描述
    - 按揉
    - 揉开
    - 揉捏
    - 推拿
    - 按压
    # 医疗用语
    - 疗法
    - 疗愈
  extra_warn:
    - 穴  # 穴位名称需和门店实际服务一致，审核时核对
    - 按摩  # 招商文案提到「按摩店店主」可以，描写本店服务时不行
    - 力度
    - 失眠症
    - 神经衰弱
    - 焦虑症
    - 抑郁
  disclaimer: 本服务为养生保健服务，不能替代医疗诊治；长期睡眠困扰请及时就医。
  disclaimer_audiences: [c_local]
