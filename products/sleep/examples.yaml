  text: |-
    下班后终于给自己安排了一次放松｜睡前一小时的松弛感

    最近项目赶工，每天到家脑子还在转，躺下也很难静下来。
    朋友推荐了楼下这家做助眠放松的小店，抱着试试看的心态去了。

    进门先跟技师聊了几句最近的作息，她会根据你的状态调整力度。
    整个过程灯光很暗，配着很轻的音乐，肩颈那块紧绷的地方被慢慢揉开，中途差点睡着。

    出来的时候整个人是松的。今晚打算早点放下手机，好好睡一觉。

    #放松时刻 #打工人的自我照顾 #睡前仪式感 #肩颈放松
- channel: douyin_script
  content_type: seeding
  text: |-
    【0-3 秒】你是不是也这样：人躺在床上，脑子还在开会？
    【4-40 秒】我们店做的是助眠放松手法。服务前先聊聊你最近的作息，再根据你的状态调整力度。灯光调暗，音乐放轻，从肩颈开始一点点帮你把紧绷的地方松开。很多顾客做到一半就睡着了。
    【41-55 秒】下班后给自己一个小时，好好放松一下。想了解的话可以私信我，或者直接来店里看看。
