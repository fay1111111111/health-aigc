# 风格样例：每个渠道收集 10 到 20 条优质参考（拆解写法，不要复用原句）。
# 下面两条是起步样例，用于演示格式，可以直接替换。服务描写已按「颅骶放松不是按摩」修改。
- channel: xiaohongshu
  content_type: seeding
  text: |-
    下班后终于给自己安排了一次放松｜睡前一小时的松弛感

    最近项目赶工，每天到家脑子还在转，躺下也很难静下来。
    朋友推荐了一家做颅骶放松的小店，抱着试试看的心态去了。

    进门先和老师聊了几句最近的作息，她没有急着开始，先让我躺好、慢慢呼吸。
    整个过程灯光很暗，配着很轻的音乐，手的接触很轻很轻，完全不是按摩那种感觉，就是一点点安静下来，中途差点睡着。

    出来的时候整个人是松的。老师还教了我一个睡前可以自己做的呼吸方法，今晚打算早点放下手机试试。

    #放松时刻 #打工人的自我照顾 #睡前仪式感 #颅骶放松
- channel: douyin_script
  content_type: seeding
  text: |-
    【0-3 秒】你是不是也这样：人躺在床上，脑子还在开会？
    【4-40 秒】我们店做的是颅骶放松。先别把它想成按摩，它不按也不揉，老师的手接触得很轻。先聊聊你最近的状态，然后灯光调暗、音乐放轻，你只需要躺着，慢慢把呼吸放下来。很多顾客做到一半就睡着了。
    【41-55 秒】下班后给自己一个小时，好好安静一下。想了解的话可以私信我，或者直接来店里看看。
