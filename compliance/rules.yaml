# 底座通用的合规词表，所有产品线共用；产品线自己的词写在 products/<id>/product.yaml。
# block：命中即不能导出，系统会自动改写一次，仍命中则需人工修改。
# warn：提示审核人员留意，不强制拦截。
# allow：常见的正常用法，检测前先排除，避免误判（例如“第一次”不算绝对化用语）。

allow:
  - 第一次
  - 第一步
  - 第一天
  - 第一周
  - 第一个
  - 第一时间
  - 第一阶段
  - 第一眼

block:
  # 广告法禁用的绝对化用语
  - 最佳
  - 最强
  - 第一
  - 顶级
  - 极品
  - 国家级
  - 世界级
  - 全网最
  - 史无前例
  - 万能
  - 100%
  - 百分之百
  # 医疗功效与诊疗用语（养生服务不能使用）
  - 治疗
  - 治愈
  - 根治
  - 疗效
  - 疗程
  - 药到病除
  - 包治
  - 康复
  - 处方
  - 诊断
  - 患者
  - 病人
  - 无副作用
  - 零风险
  - 保证见效
  - 立竿见影
  - 永不复发

warn:
  - 最好
  - 改善睡眠
  - 调理
  - 神奇
  - 秘方
  - 祖传
  - 医生推荐
  - 专家推荐
  - 权威
  - 首选
  - 特效
